<div class="products-page">
  <div class="page-header">
    <div>
      <h2>Product Catalog</h2>
      <p class="text-muted">Manage product list, inventory, and pricing</p>
    </div>
    <button class="btn btn-primary" (click)="openModal()"><i class="fa-solid fa-plus"></i> Add Product</button>
  </div>

  <div class="glass-card table-card">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Category</th>
            <th>Price ($)</th>
            <th>Stock Quantity</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of products">
            <td><strong>{{ p.name }}</strong></td>
            <td>{{ p.category || 'General' }}</td>
            <td class="text-emerald">${{ p.price | number:'1.2-2' }}</td>
            <td>
              <span class="badge" [ngClass]="p.stockQuantity > 5 ? 'badge-success' : 'badge-danger'">
                {{ p.stockQuantity }} units
              </span>
            </td>
            <td>
              <button class="btn btn-danger btn-icon" (click)="deleteProduct(p.id!)"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" *ngIf="showModal">
    <div class="modal-content glass-card">
      <h3>Add Product</h3>
      <form (ngSubmit)="saveProduct()">
        <div class="form-group">
          <label>Product Name *</label>
          <input type="text" [(ngModel)]="formData.name" name="name" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Price ($) *</label>
          <input type="number" [(ngModel)]="formData.price" name="price" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Stock Quantity *</label>
          <input type="number" [(ngModel)]="formData.stockQuantity" name="stockQuantity" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Category</label>
          <input type="text" [(ngModel)]="formData.category" name="category" class="form-control" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>
</div>
