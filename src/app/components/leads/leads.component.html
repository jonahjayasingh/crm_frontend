<div class="leads-page">
  <div class="page-header">
    <div>
      <h2>Sales Lead Pipeline</h2>
      <p class="text-muted">Track prospects from initial contact to conversion</p>
    </div>
    <button class="btn btn-primary" (click)="openModal()"><i class="fa-solid fa-plus"></i> Add New Lead</button>
  </div>

  <div class="glass-card table-card">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Lead Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Company</th>
            <th>Source</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let l of leads">
            <td><strong>{{ l.name }}</strong></td>
            <td>{{ l.email }}</td>
            <td>{{ l.phone }}</td>
            <td>{{ l.company || '-' }}</td>
            <td>{{ l.source || '-' }}</td>
            <td>
              <span class="badge" [ngClass]="getBadgeClass(l.status)">{{ l.status }}</span>
            </td>
            <td>
              <button class="btn btn-secondary btn-icon" (click)="editLead(l)"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-danger btn-icon" (click)="deleteLead(l.id!)"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" *ngIf="showModal">
    <div class="modal-content glass-card">
      <h3>{{ editingId ? 'Edit Lead' : 'New Lead' }}</h3>
      <form (ngSubmit)="saveLead()">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" [(ngModel)]="formData.name" name="name" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" [(ngModel)]="formData.email" name="email" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Phone *</label>
          <input type="text" [(ngModel)]="formData.phone" name="phone" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Company</label>
          <input type="text" [(ngModel)]="formData.company" name="company" class="form-control" />
        </div>
        <div class="form-group">
          <label>Status</label>
          <select [(ngModel)]="formData.status" name="status" class="form-control">
            <option value="NEW">NEW</option>
            <option value="CONTACTED">CONTACTED</option>
            <option value="QUALIFIED">QUALIFIED</option>
            <option value="CONVERTED">CONVERTED</option>
            <option value="LOST">LOST</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Lead</button>
        </div>
      </form>
    </div>
  </div>
</div>
