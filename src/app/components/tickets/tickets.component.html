<div class="tickets-page">
  <div class="page-header">
    <div>
      <h2>Support Tickets</h2>
      <p class="text-muted">Customer service issues & incident management</p>
    </div>
    <button class="btn btn-primary" (click)="openModal()"><i class="fa-solid fa-plus"></i> Open Support Ticket</button>
  </div>

  <div class="glass-card table-card">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Subject</th>
            <th>Customer</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of tickets">
            <td><strong>{{ t.subject }}</strong></td>
            <td>{{ t.customerName || 'Customer #' + t.customerId }}</td>
            <td><span class="badge" [ngClass]="t.priority === 'CRITICAL' || t.priority === 'HIGH' ? 'badge-danger' : 'badge-warning'">{{ t.priority }}</span></td>
            <td><span class="badge" [ngClass]="t.status === 'RESOLVED' || t.status === 'CLOSED' ? 'badge-success' : 'badge-info'">{{ t.status }}</span></td>
            <td>
              <button class="btn btn-danger btn-icon" (click)="deleteTicket(t.id!)"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" *ngIf="showModal">
    <div class="modal-content glass-card">
      <h3>Open Support Ticket</h3>
      <form (ngSubmit)="saveTicket()">
        <div class="form-group">
          <label>Subject *</label>
          <input type="text" [(ngModel)]="formData.subject" name="subject" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Description *</label>
          <textarea [(ngModel)]="formData.description" name="description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label>Customer *</label>
          <select [(ngModel)]="formData.customerId" name="customerId" class="form-control" required>
            <option *ngFor="let c of customers" [value]="c.id">{{ c.name }}</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Ticket</button>
        </div>
      </form>
    </div>
  </div>
</div>
